<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty | Sainik Institute</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <header class="header">

        <div class="logo-section">

            <img src="images/logo.png" alt="">

            <h2>SIMT</h2>

        </div>

    </header>

    <section class="hero">

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <h1>Our <span>Faculty</span></h1>

            <p>
                Learn from experienced and highly qualified educators.
            </p>

        </div>

    </section>

    <section class="faculty section-padding">

        <div class="section-title">

            <h2>Meet Our Experts</h2>

        </div>

        <div class="faculty-container">

            <div class="faculty-card">

                <img src="images/faculty.jpg" alt="">

                <h3>Dr. Rajesh Kumar</h3>

                <p>Technology Department</p>

            </div>

            <div class="faculty-card">

                <img src="images/faculty.jpg" alt="">

                <h3>Prof. Anjali Sharma</h3>

                <p>Business Management</p>

            </div>

            <div class="faculty-card">

                <img src="images/faculty.jpg" alt="">

                <h3>Dr. Aman Verma</h3>

                <p>Artificial Intelligence</p>

            </div>

        </div>

    </section>

    <script src="js/script.js"></script>

</body>

</html>
