<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | SIMT</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <section class="hero">

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <div style="
                background:white;
                padding:50px;
                border-radius:20px;
                width:350px;
                margin:auto;
                color:#1E293B;
            ">

                <h2 style="margin-bottom:30px;">
                    Student Login
                </h2>

                <form>

                    <input type="email"
                           placeholder="Email"
                           style="
                        width:100%;
                        padding:15px;
                        margin-bottom:20px;
                        border:1px solid #ccc;
                        border-radius:8px;
                    ">

                    <input type="password"
                           placeholder="Password"
                           style="
                        width:100%;
                        padding:15px;
                        margin-bottom:20px;
                        border:1px solid #ccc;
                        border-radius:8px;
                    ">

                    <button class="btn primary-btn"
                            style="width:100%;">

                        Login

                    </button>

                </form>

            </div>

        </div>

    </section>

</body>

</html>
