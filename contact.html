<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Sainik Institute</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="hero">

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <h1>Contact <span>Us</span></h1>

            <p>
                Reach out to us for admissions and inquiries.
            </p>

        </div>

    </section>

    <section class="section-padding">

        <div class="section-title">

            <h2>Get In Touch</h2>

        </div>

        <div class="about-container">

            <div class="about-content">

                <h3>Contact Information</h3>

                <p>Email: info@sainikinstitute.com</p>

                <p>Phone: +91 9876543210</p>

                <p>Address: Punjab, India</p>

            </div>

            <div class="about-content">

                <form>

                    <input type="text" placeholder="Your Name"
                           style="width:100%;padding:15px;margin-bottom:15px;">

                    <input type="email" placeholder="Your Email"
                           style="width:100%;padding:15px;margin-bottom:15px;">

                    <textarea placeholder="Message"
                              style="width:100%;padding:15px;height:150px;"></textarea>

                    <br><br>

                    <button class="btn primary-btn">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </section>

</body>

</html>
